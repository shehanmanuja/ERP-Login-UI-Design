<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eximius Power And Energy | Sign In</title>
    <meta name="description" content="Sign in to Mass Energy Holdings ERP Portal.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background Video -->
    <div class="video-container">
        <video autoplay loop muted playsinline class="bg-video" id="bgVideo">
            <source src="Scene.mp4" type="video/mp4">
        </video>
        <div class="video-overlay"></div>
    </div>

    <!-- Ambient Glow Orbs -->
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <main class="login-wrapper">
        <div class="container">

            <!-- Left: Company Info -->
            <section class="info-section">
                <div class="company-info">
                    <img src="logo2.png" alt="Eximius Power And Energy Logo" class="company-logo" id="companyLogo">
                    <h1 class="company-name">Eximius Power And Energy</h1>
                    <p class="company-tagline">Your Technology Partner</p>
                    <p class="company-desc">Quotations, projects, inventory, accounts tuned to your company brand.</p>
                    <a href="https://www.eximiuspe.com" target="_blank" rel="noopener noreferrer"
                        class="company-website">www.eximiuspe.com</a>
                </div>
            </section>

            <!-- Right: Login Card -->
            <section class="card-section">
                <div class="login-card">
                    <h2 class="card-title">Sign in</h2>
                    <p class="card-subtitle">Welcome back to Eximius Power And Energy (Private) Limited.</p>

                    <form id="loginForm" onsubmit="handleLogin(event)" novalidate>

                        <div class="form-group">
                            <label for="username" class="form-label">Username</label>
                            <div class="input-wrapper">
                                <input type="text" id="username" class="form-input" placeholder="Enter username"
                                    required autocomplete="username">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-wrapper">
                                <input type="password" id="password" class="form-input" placeholder="Enter password"
                                    required autocomplete="current-password">
                                <button type="button" class="eye-btn" onclick="togglePassword()"
                                    aria-label="Toggle password">
                                    <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                        stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="signin-btn" id="signinBtn">
                            <span class="btn-text">Sign in</span>
                            <span class="btn-loader">
                                <svg class="spinner" width="20" height="20" viewBox="0 0 50 50">
                                    <circle class="path" cx="25" cy="25" r="20" fill="none" stroke-width="5"></circle>
                                </svg>
                            </span>
                        </button>

                    </form>

                    <div class="card-footer">
                        <a href="https://exisolar.cyberneticde.site/employee-login" class="employee-link"
                            target="_blank" rel="noopener noreferrer">
                            Employee? Sign in to the Employee Portal
                        </a>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <!-- Tech Success Overlay (Centered Glass Modal) -->
    <div class="success-overlay" id="successOverlay">
        <div class="success-card">
            <div class="success-scanline"></div>
            <div class="success-grid"></div>
            <button class="success-close" id="successClose" onclick="closeSuccess()"
                aria-label="Close">&#10005;</button>
            <div class="success-content">
                <!-- Animated Circle + Checkmark -->
                <div class="success-icon-wrap">
                    <svg class="success-ring" viewBox="0 0 120 120">
                        <circle class="ring-track" cx="60" cy="60" r="54" fill="none" stroke-width="3" />
                        <circle class="ring-progress" cx="60" cy="60" r="54" fill="none" stroke-width="3" />
                    </svg>
                    <svg class="success-check" viewBox="0 0 52 52" fill="none">
                        <polyline class="check-path" points="10,28 22,40 42,16" stroke-width="5" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                    <div class="success-pulse"></div>
                </div>

                <!-- Status Tag -->
                <div class="success-tag">
                    <span class="success-tag-dot"></span>
                    <span>ACCESS GRANTED</span>
                </div>

                <!-- Typewriter Text -->
                <h2 class="success-title" id="successTitle"></h2>
                <p class="success-sub" id="successSub"></p>

                <!-- Loading bar -->
                <div class="success-bar-wrap">
                    <div class="success-bar" id="successBar"></div>
                </div>
                <p class="success-redirect">Redirecting to dashboard...</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
